"Type: Breaking change":
  - head-branch:
    - '^breaking/'
    - '^breaking-'

"Type: Feature":
  - head-branch:
    - '^feat/'
    - '^feat-'
    - '^feature/'
    - '^feature-'

"Type: Bug":
  - head-branch:
    - '^fix/'
    - '^fix-'
    - '^bugfix/'
    - '^bugfix-'
    - '^bug/'
    - '^bug-'

"Deprecation":
  - head-branch:
    - '^deprecate/'
    - '^deprecate-'
    - '^deprecation/'
    - '^deprecation-'

"Type: Maintenance":
  - head-branch:
    - '^chore/'
    - '^chore-'
    - '^maintenance/'
    - '^maintenance-'
    - '^maint/'
    - '^maint-'
    - '^deps/'
    - '^deps-'
    - '^dependencies/'
    - '^dependencies-'
  - changed-files:
    - any-glob-to-any-file:
      - '.github/workflows/**'
      - '.github/labeler.yaml'
      - '.github/dependabot.yml'
      - '.github/release.yml'

"Type: Documentation":
  - head-branch:
    - '^docs/'
    - '^docs-'
    - '^doc/'
    - '^doc-'
  - changed-files:
    - any-glob-to-any-file: 'docs/**'

"Modules":
  - changed-files:
    - any-glob-to-any-file:
      - 'modules/**'
      - '**/*.tf'

"Examples":
  - changed-files:
    - any-glob-to-any-file:
      - 'examples/**'

"Tests":
  - changed-files:
    - any-glob-to-any-file:
      - 'tests/**'
      - '**/*_test.tf'

"CI":
  - changed-files:
    - any-glob-to-any-file:
      - '.github/**'
      - '.github/workflows/**'
      - '.github/dependabot.yml'

"Security":
  - changed-files:
    - any-glob-to-any-file:
      - 'SECURITY.md'
      - '.github/dependabot.yml'
