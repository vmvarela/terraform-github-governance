name: Pull Request Labeler

on: [pull_request_target]

jobs:
  label:

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
    - uses: actions/labeler@v6
      with:
        # Token de autenticación de GitHub necesario para la acción
        repo-token: "${{ secrets.GITHUB_TOKEN }}"
        sync-labels: true
