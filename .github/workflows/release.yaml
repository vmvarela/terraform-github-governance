name: Manual Release Publish
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (optional). If empty, will publish the first draft found'
        required: false
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Refresh release draft
        uses: release-drafter/release-drafter@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          version: ${{ github.event.inputs.tag || '' }}

      - name: Publish draft release
        uses: actions/github-script@v8
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const tag = (context.payload.inputs && context.payload.inputs.tag) || '';
            const releases = await github.rest.repos.listReleases({ owner, repo });
            const draft = releases.data.find(r => r.draft && (tag ? r.tag_name === tag : true));
            if (!draft) core.setFailed('No draft release found' + (tag ? ' for tag: ' + tag : ''));
            await github.rest.repos.updateRelease({
              owner,
              repo,
              release_id: draft.id,
              draft: false
            });
            core.info('Published release: ' + draft.html_url);
