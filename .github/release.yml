# Configuration for GitHub's Automatically generated release notes
# See: https://docs.github.com/en/repositories/releasing-projects-on-github/automatically-generated-release-notes

changelog:
  exclude:
    labels:
      - skip-release
    authors:
      - octocat
  categories:
    - title: "Documentation"
      labels:
        - "Documentation"
    - title: "Modules"
      labels:
        - "Modules"
    - title: "Examples"
      labels:
        - "Examples"
    - title: "Tests"
      labels:
        - "Tests"
    - title: "CI"
      labels:
        - "CI"
    - title: "Security"
      labels:
        - "Security"
    - title: "Other changes"
      labels: ['*']
